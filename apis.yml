aid: mth-sense
name: mth Sense
description: >-
  mth Sense (Mth Sense Inc.), operating as RevSense, is a mobile ad-technology
  company founded in 2011 by Mandar Agte and Mohan Balachandran and backed by
  Y Combinator (Summer 2012). It began as a mobile on-device profiling and
  ad-serving platform that inferred demographic and psychographic audience
  profiles from app-usage data, and has evolved into a programmatic yield and
  revenue-optimization platform for digital publishers. The RevSense product
  suite provides machine-learning yield optimization (real-time price floors,
  frequency caps, geo controls), automated header-bidding tag management, a
  unified reporting and data platform aggregating ad-server and demand-partner
  data, and one-click demand/buyer integration. mth Sense markets to publishers,
  agencies, SSPs, ad networks, and advertisers, and will build private
  exchanges with an RTB engine and common reporting dashboards. As of this
  profile the company publishes a static marketing website with no public
  developer portal, API documentation, or SDKs.
