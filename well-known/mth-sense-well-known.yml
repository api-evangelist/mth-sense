note: >-
  Every /.well-known/ path on mthsense.com answers HTTP 300 "Multiple Choices" —
  the Apache mod_negotiation catch-all that the static marketing site returns for
  any unmatched path under a directory, with an iso-8859-1 HTML body. None of them
  return a document, so NO WellKnown or SecurityTxt pointer is emitted. Ordinary
  missing paths (/robots.txt, /openapi.json) return a proper 404 with the site's
  own HTML 404 page, which confirms the 300s are negotiation noise rather than
  content. mthsense.com is the only host: api., app., docs., developer., dev.,
  portal., dashboard., admin. and revsense. subdomains are all NXDOMAIN.
